<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real Estate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Dark theme overrides */
    body { background-color: #000; color: #fff; }
    .card, .list-group-item, .alert { background-color: #0d0d0d !important; color: #fff !important; }
    /* Navbar set to grey to contrast with the black background */
    .navbar { background-color: #6c757d !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    a { color: #66d9ff; }
    .form-control, .form-select { background-color: #111; color: #fff; border-color: #333; }
    .form-control:focus, .form-select:focus { box-shadow: none; border-color: #555; }
    .list-group-item { border-color: #222; }
    .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
    .btn-success { background-color: #198754; border-color: #198754; }
    .card .card-body { background-color: transparent; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'listing_list' %}">Real Estate</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="{% url 'profile_update' %}">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-info">{{ m }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
