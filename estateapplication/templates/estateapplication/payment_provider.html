{% extends 'base.html' %}
{% block content %}
<h1>Payment Provider (Stub)</h1>
<p>You're paying for: <strong>{{ listing.title }}</strong></p>
<p>Amount: ${{ listing.price }}</p>
<p>Session: {{ session_id }}</p>
<form method="post" action="{% url 'pay_listing' listing.pk %}">

  <p><label>Expiry (MM/YY): <input name="expiry" value="12/34"></label></p>

  <button type="submit">Complete Payment (stub)</button>
</form>
<p>This is a simulated payment provider for development/testing. No real money is transferred.</p>
{% endblock %}
