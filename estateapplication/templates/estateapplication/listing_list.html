{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Listings</h1>
  <a class="btn btn-sm btn-primary" href="{% url 'register' %}">Create account</a>
</div>

<form method="get" class="row g-2 mb-3">
  <div class="col-md-6">
    <input type="text" name="q" class="form-control" placeholder="Search" value="{{ request.GET.q }}">
  </div>
  <div class="col-md-3">
    <select name="category" class="form-select">
      <option value="">All</option>
      <option value="sale">Sale</option>
      <option value="rent">Rent</option>
      <option value="buy">Buy</option>
    </select>
  </div>
  <div class="col-md-3">
    <button type="submit" class="btn btn-outline-primary">Search</button>
  </div>
</form>

<div class="list-group">
  {% for listing in listings %}
    <a href="{% url 'listing_detail' listing.pk %}" class="list-group-item list-group-item-action">
      <div class="d-flex w-100 justify-content-between">
        <h5 class="mb-1">{{ listing.title }}</h5>
        <small class="text-muted">${{ listing.price }}</small>
      </div>
      <p class="mb-1">{{ listing.description|truncatechars:120 }}</p>
      <small class="text-muted">{{ listing.get_category_display }}</small>
    </a>
  {% empty %}
    <div class="list-group-item">No listings found.</div>
  {% endfor %}
</div>

{% endblock %}
