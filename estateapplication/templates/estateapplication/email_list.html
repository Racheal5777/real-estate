{% extends 'base.html' %}
{% block content %}
<h2>Saved Emails</h2>
{% if files %}
  <ul class="list-group">
    {% for f in files %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'email_detail' f.name %}">{{ f.name }}</a>
        <small class="text-muted">{{ f.size }} bytes</small>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No saved emails found.</p>
{% endif %}
{% endblock %}
