{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Pay for {{ listing.title }}</h3>
    <p>Amount: ${{ listing.price }}</p>
    <form method="post" action="{% url 'paystack_start' listing.pk %}">{% csrf_token %}
      <button class="btn btn-success" type="submit">Pay with Paystack</button>
    </form>
  </div>
</div>
{% endblock %}
